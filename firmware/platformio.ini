; Casio-Deck Firmware fuer den Seeed XIAO ESP32S3 Sense.
; Der Sketch liegt in casio_deck/, damit er auch direkt mit der Arduino-IDE
; geoeffnet werden kann (casio_deck/casio_deck.ino).

[platformio]
src_dir = casio_deck
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
; pioarduino: Arduino-ESP32-Core 3.x (das offizielle espressif32 bleibt bei 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Sense-Board: 8 MB Octal-PSRAM (fuer Kamera-Framebuffer)
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
